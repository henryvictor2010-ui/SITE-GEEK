<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carrinho - Loja Geek</title>
  <link rel="icon" type="image/jpeg" href="Imagens/universal geek logo.jpg">
  <link rel="stylesheet" href="css/carrinho.css">
</head>
<body>

  <!-- Cabecalho principal da página -->
  <header class="site-header">
    <div class="main-header"></div>
    
    <!-- Menu de navegação -->
    <nav class="nav-menu">
      <ul class="nav-list">
        <li><a href="index.html">INÍCIO</a></li>
      </ul>
    </nav>
  </header>

  <!-- Container principal dividindo o layout em 2 colunas no CSS -->
  <main class="cart-container">
    
    <!-- COLUNA DA ESQUERDA: Exibição dos produtos adicionados -->
    <section class="cart-left-col">
      <!-- Cabeçalho explicativo da tabela de produtos -->
      <div class="cart-table-header">
        <span>Produto</span>
        <span>Preço</span>
        <span>Quantidade</span>
        <span></span>
      </div>

      <!-- Container onde o JavaScript vai inserir as linhas dos produtos dinamicamente -->
      <div id="cartListContainer"></div>

      <!-- Campo para digitação e cálculo do Frete pelo CEP -->
      <div class="shipping-box">
        <input type="text" id="cepInput" placeholder="Digite o CEP (ex: 66000000)" maxlength="9">
        <button type="button" onclick="calculateShipping()">Calcular Frete</button>
      </div>

      <a href="#" class="shipping-link">🚛 Clique aqui e confira a política de frete grátis</a>
    </section>

    <!-- COLUNA DA DIREITA: Resumo financeiro e Cupom de Desconto -->
    <aside class="cart-right-col">
      
      <!-- Card para aplicação do cupom -->
      <div class="card-box coupon-box">
        <h4>Possuí Cupom?</h4>
        <div class="coupon-input-group">
          <input type="text" id="couponInput" placeholder="Cupom Code">
          <button type="button" onclick="applyCoupon()">Aplicar</button>
        </div>
        <!-- Exibe mensagem de erro ou sucesso do cupom -->
        <span id="couponMsg" class="coupon-message"></span>
      </div>

      <!-- Card com os totais da compra e botões de ação -->
      <div class="card-box">
        <div class="summary-row">
          <span>Subtotal:</span>
          <span id="subtotalVal">R$ 0,00</span>
        </div>
        <div class="summary-row">
          <span>Frete:</span>
          <span id="shippingVal">--</span>
        </div>
        <!-- Exibido apenas se um cupom válido for aplicado -->
        <div class="summary-row discount" id="discountRow" style="display: none;">
          <span>Desconto (85%):</span>
          <span id="discountVal">- R$ 0,00</span>
        </div>
        <div class="summary-row total">
          <span>Total:</span>
          <span id="totalVal">R$ 0,00</span>
        </div>

        <!-- Exibe o cálculo do programa de fidelidade -->
        <div class="coins-info">
          🟡 Você ganhará: <strong id="coinsVal">0 GGcoins</strong>
        </div>

        <!-- Botões para seguir para o pagamento, continuar comprando ou limpar o carrinho -->
        <a href="pagamento.html" class="link-finish">
          <button type="button" class="btn-finish">Finalizar Compra</button>
        </a>
        <a href="index.html" class="btn-keep-shopping">Continuar Comprando</a>
        <button type="button" class="btn-clear-cart" onclick="clearCart()">Limpar Carrinho</button>
      </div>

    </aside>

  </main>

<script src="js/carrinho.js"></script>


</body>
</html>
