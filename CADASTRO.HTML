<!DOCTYPE html>
<html lang="pt-BR">


<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


    <title>Cadastro - Universal Geek</title>


    <link rel="stylesheet" href="cadastro.css">
</head>


<body>


    <div class="cadastro-container">


        <div class="titulo-cadastro">
            <h1>UNIVERSAL <span>GEEK</span></h1>
            <h2>Cadastro de Cliente</h2>
            <p>Preencha seus dados para criar sua conta.</p>
        </div>




        <form id="formCadastro">


            <div class="campo campo-grande">
                <label for="nome">Nome completo:</label>
                <input
                    type="text"
                    id="nome"
                    placeholder="Digite seu nome completo"
                    required>
            </div>




            <div class="campo">
                <label for="cpf">CPF:</label>
                <input
                    type="text"
                    id="cpf"
                    placeholder="000.000.000-00"
                    maxlength="14"
                    inputmode="numeric"
                    required>
            </div>




            <div class="campo">
                <label for="nascimento">Data de nascimento:</label>
                <input
                    type="date"
                    id="nascimento"
                    required>
            </div>




            <div class="campo">
                <label for="email">E-mail:</label>
                <input
                    type="email"
                    id="email"
                    placeholder="Digite seu e-mail"
                    required>
            </div>




            <div class="campo">
                <label for="telefone">Telefone:</label>
                <input
                    type="text"
                    id="telefone"
                    placeholder="Digite seu telefone"
                    required>
            </div>




            <div class="campo campo-grande">
                <label for="endereco">Endereço:</label>
                <input
                    type="text"
                    id="endereco"
                    placeholder="Rua e número"
                    required>
            </div>


           
            <div class="campo">
                <label for="bairro">Bairro:</label>
                <input
                    type="text"
                    id="bairro"
                    placeholder="Digite seu bairro"
                    required>
            </div>




            <div class="campo">
                <label for="cidade">Cidade:</label>
                <input
                    type="text"
                    id="cidade"
                    placeholder="Digite sua cidade"
                    required>
            </div>




            <div class="campo">
                <label for="estado">Estado:</label>
                <input
                    type="text"
                    id="estado"
                    placeholder="Digite seu estado"
                    required>
            </div>




            <div class="campo">
                <label for="cep">CEP:</label>
                <input
                    type="text"
                    id="cep"
                    placeholder="Digite seu CEP"
                    required>
            </div>




            <div class="campo">
                <label for="senha">Senha:</label>
                <input
                    type="password"
                    id="senha"
                    placeholder="Crie uma senha"
                    required>
            </div>




            <div class="campo">
                <label for="confirmarSenha">Confirmar senha:</label>
                <input
                    type="password"
                    id="confirmarSenha"
                    placeholder="Digite a senha novamente"
                    required>
            </div>




            <div class="area-botao">


                <p id="mensagem"></p>


                <button type="submit">
                    Finalizar Cadastro
                </button>


                <a href="index.html">Voltar para a loja</a>


            </div>


        </form>


    </div>





</body>


</html>




<style>
    * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;


    font-family: 'Segoe UI', Arial, sans-serif;
}




:root {
    --terracota: #A85032;
    --off-white: #EFE8DE;
    --text-dark: #63321A;
    --text-muted: #8C6A58;
    --border-color: #D5CBC0;
}




body {
    background-color: var(--off-white);
    color: var(--text-dark);


    min-height: 100vh;


    display: flex;
    justify-content: center;
    align-items: center;


    padding: 40px 20px;
}




.cadastro-container {
    background-color: white;


    width: 100%;
    max-width: 950px;


    padding: 35px 45px;


    border: 1px solid var(--border-color);
    border-radius: 12px;


    box-shadow: 0 8px 25px rgba(99, 50, 26, 0.12);
}




/* TÍTULO */


.titulo-cadastro {
    text-align: center;
    margin-bottom: 30px;
}




.titulo-cadastro h1 {
    font-size: 1.8rem;
    margin-bottom: 15px;
}




.titulo-cadastro h1 span {
    color: var(--terracota);
}




.titulo-cadastro h2 {
    font-size: 1.4rem;
    margin-bottom: 5px;
}




.titulo-cadastro p {
    color: var(--text-muted);
    font-size: 0.9rem;
}




/* FORMULÁRIO */


form {
    display: grid;


    grid-template-columns: 1fr 1fr;


    gap: 18px 25px;
}




.campo {
    display: flex;
    flex-direction: column;
}




.campo-grande {
    grid-column: 1 / 3;
}




label {
    margin-bottom: 6px;


    font-size: 0.9rem;
    font-weight: bold;
}




input {
    width: 100%;


    padding: 11px;


    border: 1px solid var(--border-color);
    border-radius: 5px;


    font-size: 0.9rem;


    color: var(--text-dark);
}




input:focus {
    outline: none;


    border-color: var(--terracota);


    box-shadow: 0 0 0 2px rgba(168, 80, 50, 0.10);
}




/* BOTÃO */


.area-botao {
    grid-column: 1 / 3;


    display: flex;
    flex-direction: column;
    align-items: center;


    margin-top: 10px;
}




.area-botao button {
    width: 100%;


    background-color: var(--terracota);
    color: white;


    border: none;
    border-radius: 6px;


    padding: 13px;


    font-size: 1rem;
    font-weight: bold;


    cursor: pointer;
}




.area-botao button:hover {
    background-color: #8d4329;
}




.area-botao a {
    margin-top: 15px;


    color: var(--text-dark);


    font-size: 0.85rem;
    font-weight: bold;


    text-decoration: none;
}




.area-botao a:hover {
    color: var(--terracota);
    text-decoration: underline;
}




#mensagem {
    margin-bottom: 10px;


    text-align: center;
    font-weight: bold;
}




/* CELULAR */


@media (max-width: 650px) {


    .cadastro-container {
        padding: 25px 20px;
    }




    form {
        grid-template-columns: 1fr;
    }




    .campo-grande {
        grid-column: 1;
    }




    .area-botao {
        grid-column: 1;
    }


}
</style>




<script>
    const formCadastro = document.getElementById("formCadastro");


const mensagem = document.getElementById("mensagem");


const cpfInput = document.getElementById("cpf");




cpfInput.addEventListener("input", function() {


    let cpf = cpfInput.value;




    // Remove tudo que não for número
    cpf = cpf.replace(/\D/g, "");




    // Limita para no máximo 11 números
    cpf = cpf.substring(0, 11);




    // Adiciona o primeiro ponto
    if (cpf.length > 3) {
        cpf = cpf.replace(
            /^(\d{3})(\d)/,
            "$1.$2"
        );
    }




    // Adiciona o segundo ponto
    if (cpf.length > 6) {
        cpf = cpf.replace(
            /^(\d{3})\.(\d{3})(\d)/,
            "$1.$2.$3"
        );
    }




    // Adiciona o hífen antes dos últimos 2 números
    if (cpf.length > 9) {
        cpf = cpf.replace(
            /^(\d{3})\.(\d{3})\.(\d{3})(\d)/,
            "$1.$2.$3-$4"
        );
    }




    cpfInput.value = cpf;


});


formCadastro.addEventListener("submit", function(event) {


    event.preventDefault();




    const nome = document.getElementById("nome").value;


    const cpf = document.getElementById("cpf").value;


    const nascimento = document.getElementById("nascimento").value;


    const email = document.getElementById("email").value;


    const telefone = document.getElementById("telefone").value;


    const endereco = document.getElementById("endereco").value;


    const numero = document.getElementById("numero").value;


    const bairro = document.getElementById("bairro").value;


    const cidade = document.getElementById("cidade").value;


    const estado = document.getElementById("estado").value;


    const cep = document.getElementById("cep").value;


    const senha = document.getElementById("senha").value;


    const confirmarSenha =
        document.getElementById("confirmarSenha").value;




    // Verifica se as senhas são iguais


    if (senha !== confirmarSenha) {


        mensagem.innerText =
            "As senhas não são iguais.";


        mensagem.style.color = "red";


        return;
    }




    // Cria o cadastro do cliente


    const cliente = {


        nome: nome,
        cpf: cpf,
        nascimento: nascimento,
        email: email,
        telefone: telefone,
        endereco: endereco,
        numero: numero,
        bairro: bairro,
        cidade: cidade,
        estado: estado,
        cep: cep


    };




    // Salva os dados


    localStorage.setItem(
        "cliente",
        JSON.stringify(cliente)
    );




    // Mensagem de sucesso


    mensagem.innerText =
        "Cadastro realizado com sucesso!";


    mensagem.style.color = "green";




    // Aguarda 1 segundo e volta para a página inicial


    setTimeout(function() {


        window.location.href = "index.html";


    }, 1000);


});
</script>
